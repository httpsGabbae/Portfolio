<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="FitnessHub Pro gym management dashboard illustration">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1446"/><stop offset="1" stop-color="#6c5cff"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <circle cx="680" cy="80" r="120" fill="#ffffff" opacity=".08"/>
  <circle cx="120" cy="430" r="90" fill="#00e5cc" opacity=".15"/>
  <!-- app window -->
  <rect x="90" y="90" width="620" height="340" rx="20" fill="#0b0b16" opacity=".85"/>
  <rect x="90" y="90" width="620" height="46" rx="20" fill="#ffffff" opacity=".08"/>
  <circle cx="124" cy="113" r="7" fill="#ff5f57"/><circle cx="148" cy="113" r="7" fill="#febc2e"/><circle cx="172" cy="113" r="7" fill="#28c840"/>
  <!-- sidebar -->
  <rect x="110" y="152" width="130" height="258" rx="12" fill="url(#card1)" stroke="#ffffff" stroke-opacity=".2"/>
  <rect x="126" y="172" width="70" height="12" rx="6" fill="#6c5cff"/>
  <rect x="126" y="196" width="98" height="10" rx="5" fill="#ffffff" opacity=".35"/>
  <rect x="126" y="214" width="98" height="10" rx="5" fill="#ffffff" opacity=".25"/>
  <rect x="126" y="232" width="98" height="10" rx="5" fill="#ffffff" opacity=".25"/>
  <rect x="126" y="260" width="98" height="34" rx="8" fill="#00e5cc" opacity=".85"/>
  <!-- stat cards -->
  <rect x="256" y="152" width="130" height="80" rx="12" fill="url(#card1)" stroke="#ffffff" stroke-opacity=".2"/>
  <rect x="398" y="152" width="130" height="80" rx="12" fill="url(#card1)" stroke="#ffffff" stroke-opacity=".2"/>
  <rect x="540" y="152" width="150" height="80" rx="12" fill="#6c5cff"/>
  <text x="272" y="182" font-family="Arial" font-size="15" fill="#a7adbd">Members</text>
  <text x="272" y="208" font-family="Arial" font-weight="bold" font-size="26" fill="#fff">1,240</text>
  <text x="414" y="182" font-family="Arial" font-size="15" fill="#a7adbd">Trainers</text>
  <text x="414" y="208" font-family="Arial" font-weight="bold" font-size="26" fill="#fff">36</text>
  <text x="556" y="182" font-family="Arial" font-size="15" fill="#06060a">Payments</text>
  <text x="556" y="208" font-family="Arial" font-weight="bold" font-size="26" fill="#06060a">₱48k</text>
  <!-- bar chart -->
  <rect x="256" y="248" width="434" height="162" rx="12" fill="url(#card1)" stroke="#ffffff" stroke-opacity=".2"/>
  <rect x="282" y="330" width="34" height="54" rx="6" fill="#6c5cff"/>
  <rect x="328" y="302" width="34" height="82" rx="6" fill="#6c5cff" opacity=".8"/>
  <rect x="374" y="318" width="34" height="66" rx="6" fill="#00e5cc"/>
  <rect x="420" y="284" width="34" height="100" rx="6" fill="#00e5cc" opacity=".85"/>
  <rect x="466" y="310" width="34" height="74" rx="6" fill="#ffffff" opacity=".5"/>
  <rect x="512" y="270" width="34" height="114" rx="6" fill="#ffffff" opacity=".7"/>
  <rect x="558" y="296" width="34" height="88" rx="6" fill="#6c5cff" opacity=".6"/>
  <rect x="604" y="322" width="34" height="62" rx="6" fill="#00e5cc" opacity=".6"/>
  <!-- dumbbell badge -->
  <g transform="translate(636,330)">
    <rect x="-34" y="-8" width="68" height="16" rx="8" fill="#0b0b16" stroke="#fff" stroke-width="3"/>
    <rect x="-52" y="-20" width="14" height="40" rx="5" fill="#fff"/>
    <rect x="38" y="-20" width="14" height="40" rx="5" fill="#fff"/>
  </g>
  <text x="90" y="465" font-family="Arial" font-weight="bold" font-size="30" fill="#ffffff">FitnessHub Pro</text>
  <text x="380" y="465" font-family="Arial" font-size="20" fill="#ffffff" opacity=".75">admin • member • trainer • chat</text>

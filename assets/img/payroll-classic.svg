<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Payroll Classic login and records illustration">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a05"/><stop offset="1" stop-color="#c76a00"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>
  <circle cx="120" cy="400" r="110" fill="#ffffff" opacity=".08"/>
  <!-- login card -->
  <g>
    <rect x="80" y="90" width="300" height="300" rx="18" fill="#0b0b16" opacity=".9"/>

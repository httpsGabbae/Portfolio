    <text x="448" y="186" font-family="monospace" font-size="15" fill="#2a1a05">25-0001  ₱18,200</text>
    <text x="448" y="230" font-family="monospace" font-size="15" fill="#2a1a05">25-0002  ₱21,750</text>
    <text x="448" y="274" font-family="monospace" font-size="15" fill="#2a1a05">25-0003  ₱19,400</text>

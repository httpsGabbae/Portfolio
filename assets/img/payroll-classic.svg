    <text x="110" y="301" font-family="Arial" font-weight="bold" font-size="18" fill="#2a1a05" text-anchor="middle" x2="0">⟶  Dashboard</text>
    <text x="230" y="302" font-family="Arial" font-weight="bold" font-size="18" fill="#2a1a05" text-anchor="middle">Dashboard →</text>

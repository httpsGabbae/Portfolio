      <rect x="434" y="206" width="262" height="36" rx="8" fill="#2a1a05" opacity=".05"/>
      <rect x="434" y="250" width="262" height="36" rx="8" fill="#2a1a05" opacity=".08"/>
      <rect x="434" y="294" width="262" height="36" rx="8" fill="#ff9d00" opacity=".3"/>

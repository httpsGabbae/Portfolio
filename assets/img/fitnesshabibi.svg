<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="FitnessHabibi trainer and progress illustration">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a18"/><stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg5)"/>
  <circle cx="700" cy="90" r="110" fill="#ffffff" opacity=".1"/>
  <!-- trainer card -->
  <g>
    <rect x="80" y="90" width="300" height="300" rx="18" fill="#0b0b16" opacity=".88"/>
    <circle cx="140" cy="160" r="30" fill="#22c55e"/>
    <text x="128" y="172" font-family="Arial" font-weight="bold" font-size="26" fill="#06060a">JT</text>
    <text x="182" y="154" font-family="Arial" font-weight="bold" font-size="20" fill="#fff">Find a trainer</text>
    <text x="182" y="178" font-family="Arial" font-size="15" fill="#a7adbd">Strength • 4.9 ★</text>
    <rect x="110" y="206" width="240" height="40" rx="10" fill="#ffffff" opacity=".1"/>
    <rect x="110" y="254" width="240" height="40" rx="10" fill="#ffffff" opacity=".07"/>
    <rect x="110" y="302" width="240" height="56" rx="10" fill="#22c55e"/>
    <text x="230" y="337" font-family="Arial" font-weight="bold" font-size="18" fill="#06060a" text-anchor="middle">Book session →</text>
  </g>
  <!-- progress + plans -->
  <g>
    <rect x="410" y="90" width="310" height="300" rx="18" fill="#ffffff"/>
    <text x="434" y="130" font-family="Arial" font-weight="bold" font-size="19" fill="#0a2a18">Progress logs</text>
    <circle cx="500" cy="210" r="52" fill="none" stroke="#0a2a18" stroke-opacity=".15" stroke-width="16"/>
    <circle cx="500" cy="210" r="52" fill="none" stroke="#16a34a" stroke-width="16" stroke-linecap="round" stroke-dasharray="245 326" transform="rotate(-90 500 210)"/>
    <text x="500" y="220" font-family="Arial" font-weight="bold" font-size="26" fill="#0a2a18" text-anchor="middle">75%</text>
    <rect x="580" y="160" width="116" height="40" rx="10" fill="#16a34a" opacity=".2"/>
    <rect x="580" y="208" width="116" height="40" rx="10" fill="#16a34a" opacity=".35"/>
    <rect x="580" y="256" width="116" height="40" rx="10" fill="#0a2a18"/>
    <text x="595" y="184" font-family="Arial" font-size="14" fill="#0a2a18">Meals</text>
    <text x="595" y="232" font-family="Arial" font-size="14" fill="#0a2a18">Workouts</text>
    <text x="595" y="280" font-family="Arial" font-size="14" fill="#fff">Weights</text>
    <g fill="#16a34a" opacity=".7">
      <circle cx="444" cy="320" r="9"/><circle cx="470" cy="320" r="9"/><circle cx="496" cy="320" r="9" opacity=".35"/>
      <circle cx="522" cy="320" r="9"/><circle cx="548" cy="320" r="9" opacity=".35"/><circle cx="574" cy="320" r="9"/>
    </g>
    <text x="434" y="362" font-family="Arial" font-size="15" fill="#0a2a18" opacity=".7">workouts • meals • payments</text>
  </g>
  <text x="80" y="445" font-family="Arial" font-weight="bold" font-size="30" fill="#ffffff">FitnessHabibi Hub</text>
  <text x="460" y="445" font-family="Arial" font-size="20" fill="#ffffff" opacity=".85">PHP • MySQL • JS</text>
</svg>
